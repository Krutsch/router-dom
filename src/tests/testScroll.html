<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Router Tests</title>
    <script type="module">
      import { runTests } from "@web/test-runner-mocha";
      import { expect } from "@esm-bundle/chai";
      import Router from "/src/bundle.js";

      const sleep = (time) =>
        new Promise((resolve) => setTimeout(resolve, time));
      const waitForRouting = () =>
        new Promise((resolve) =>
          addEventListener("afterRouting", resolve, { once: true }),
        );
      const traverse = (direction) => {
        const result = navigation[direction]();
        void result.committed?.catch(() => {});
        void result.finished?.catch(() => {});
        return result;
      };
      const tall = (name) => `<div style="height: 3000px;">${name}</div>`;
      const entryKey = () => navigation.currentEntry.key;
      const storedPositions = () =>
        JSON.parse(sessionStorage.getItem("router-scroll") || "{}");

      runTests(() => {
        describe("router scroll", () => {
          it("leaves reload restoration to the browser", async () => {
            const router = new Router([
              { path: "/native-a", element: tall("A") },
              { path: "/native-b", element: tall("B") },
            ]);
            await sleep(50);
            expect(history.scrollRestoration).to.equal("auto");

            const routing = waitForRouting();
            router.go("/native-a");
            await routing;
            expect(history.scrollRestoration).to.equal("auto");
          });

          it("gives every navigation its own history entry key", async () => {
            const router = new Router([
              { path: "/key-a", element: tall("A") },
              { path: "/key-b", element: tall("B") },
            ]);
            await sleep(50);

            let routing = waitForRouting();
            router.go("/key-a");
            await routing;
            const first = entryKey();
            expect(first).to.be.a("string");

            routing = waitForRouting();
            router.go("/key-b");
            await routing;
            expect(entryKey()).to.not.equal(first);

            routing = waitForRouting();
            traverse("back");
            await routing;
            expect(entryKey()).to.equal(first);
          });

          it("resets new entries to the top and restores traversed ones", async () => {
            const router = new Router([
              { path: "/trav-a", element: tall("A") },
              { path: "/trav-b", element: tall("B") },
            ]);
            await sleep(50);

            let routing = waitForRouting();
            router.go("/trav-a");
            await routing;

            scrollTo(0, 500);
            routing = waitForRouting();
            router.go("/trav-b");
            await routing;
            expect(scrollY).to.equal(0);

            routing = waitForRouting();
            traverse("back");
            await routing;
            expect(scrollY).to.equal(500);

            routing = waitForRouting();
            traverse("forward");
            await routing;
            expect(scrollY).to.equal(0);
          });

          it("does not reuse a previous entry's position for a new visit of the same url", async () => {
            const router = new Router([
              { path: "/fresh-a", element: tall("A") },
              { path: "/fresh-b", element: tall("B") },
            ]);
            await sleep(50);

            let routing = waitForRouting();
            router.go("/fresh-a");
            await routing;

            scrollTo(0, 400);
            routing = waitForRouting();
            router.go("/fresh-b");
            await routing;

            scrollTo(0, 700);
            routing = waitForRouting();
            traverse("back");
            await routing;
            expect(scrollY).to.equal(400);

            // Same url, brand new history entry: native behaviour starts on top.
            routing = waitForRouting();
            router.go("/fresh-b");
            await routing;
            expect(scrollY).to.equal(0);

            routing = waitForRouting();
            traverse("back");
            await routing;
            expect(scrollY).to.equal(400);
          });

          it("keeps restoring while the traversed route is still growing", async () => {
            let visits = 0;
            const router = new Router([
              {
                path: "/grow-a",
                element: `<div data-grow style="height: 3000px;">A</div>`,
                afterEnter() {
                  const grow = document.querySelector("[data-grow]");
                  if (!grow || visits++ === 0) return;
                  grow.style.setProperty("height", "0px");
                  setTimeout(
                    () => grow.style.setProperty("height", "3000px"),
                    300,
                  );
                },
              },
              { path: "/grow-b", element: tall("B") },
            ]);
            await sleep(50);

            let routing = waitForRouting();
            router.go("/grow-a");
            await routing;

            scrollTo(0, 600);
            routing = waitForRouting();
            router.go("/grow-b");
            await routing;

            routing = waitForRouting();
            traverse("back");
            await routing;
            expect(scrollY).to.be.below(600);

            await sleep(600);
            expect(scrollY).to.equal(600);
          });

          it("persists the position of the current entry for reloads", async () => {
            const router = new Router([
              { path: "/hide-a", element: tall("A") },
            ]);
            await sleep(50);

            const routing = waitForRouting();
            router.go("/hide-a");
            await routing;
            scrollTo(0, 550);
            await sleep(50);

            const key = entryKey();
            dispatchEvent(new Event("pagehide"));

            // The key survives a reload, so the new document finds this position.
            expect(storedPositions()[key]).to.deep.equal([0, 550]);
            expect(history.scrollRestoration).to.equal("auto");
          });

          it("leaves BFCache restoration to the browser", async () => {
            const router = new Router([
              { path: "/bfcache-a", element: tall("A") },
            ]);
            await sleep(50);

            const routing = waitForRouting();
            router.go("/bfcache-a");
            await routing;
            scrollTo(0, 450);
            await sleep(50);

            const pageshow = new Event("pageshow");
            Object.defineProperty(pageshow, "persisted", { value: true });
            dispatchEvent(pageshow);
            await sleep(100);

            expect(scrollY).to.equal(450);
          });

          it("does not override adopted native scroll restoration", async () => {
            const router = new Router([
              { path: "/adopt-a", element: tall("A") },
            ]);
            await sleep(50);

            const routing = waitForRouting();
            router.go("/adopt-a");
            await routing;

            scrollTo(0, 500);
            await router.doRouting("/adopt-a", undefined, true);
            expect(scrollY).to.equal(500);
          });

          it("resets new routes during HMR", async () => {
            window.isHMR = true;
            const router = new Router([
              { path: "/hmr-a", element: tall("A") },
              { path: "/hmr-b", element: tall("B") },
            ]);
            await sleep(50);

            let routing = waitForRouting();
            router.go("/hmr-a");
            await routing;

            scrollTo(0, 500);
            routing = waitForRouting();
            router.go("/hmr-b");
            await routing;
            expect(scrollY).to.equal(0);
            delete window.isHMR;
          });

          it("never restores a route that opts out", async () => {
            const router = new Router([
              { path: "/opt-a", element: tall("A"), restoreScroll: false },
              { path: "/opt-b", element: tall("B") },
            ]);
            await sleep(50);

            let routing = waitForRouting();
            router.go("/opt-a");
            await routing;

            scrollTo(0, 500);
            routing = waitForRouting();
            router.go("/opt-b");
            await routing;

            routing = waitForRouting();
            traverse("back");
            await routing;
            expect(scrollY).to.equal(0);
          });
        });
      });
    </script>
  </head>
  <body>
    <a id="profile" href="/settings/profile">Profile</a>
    <div data-outlet></div>
  </body>
</html>
