<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Router Tests</title>
    <script type="module">
      import { hydro, $ } from "hydro-js";
      import { runTests } from "@web/test-runner-mocha";
      import { expect } from "@esm-bundle/chai";
      import Router from "/src/bundle.js";

      const sleep = (time) =>
        new Promise((resolve) => setTimeout(resolve, time));
      const waitForRouting = () =>
        new Promise((resolve) =>
          addEventListener("afterRouting", resolve, { once: true }),
        );

      runTests(() => {
        let router;

        describe("router", () => {
          it("uses native history scroll restoration for reloads", async () => {
            router = new Router(
              [
                {
                  path: "/scroll-a",
                  element: `<div style="height: 2000px;">A</div>`,
                },
                {
                  path: "/scroll-b",
                  element: `<div style="height: 2000px;">B</div>`,
                },
              ],
              { viewTransitions: true },
            );

            expect(history.scrollRestoration).to.equal("auto");

            let routing = waitForRouting();
            router.go("/scroll-a");
            await routing;
            expect(history.scrollRestoration).to.equal("manual");

            window.scrollTo(0, 500);
            routing = waitForRouting();
            router.go("/scroll-b");
            await routing;
            expect(window.scrollY).to.equal(0);

            routing = waitForRouting();
            history.back();
            await routing;
            expect(window.scrollY).to.equal(500);

            routing = waitForRouting();
            history.forward();
            await routing;
            expect(window.scrollY).to.equal(0);
          });

          it("does not override adopted native scroll restoration", async () => {
            router = new Router([
              {
                path: "/initial-scroll",
                element: `<div>
                  <div style="height: 2000px;">A</div>
                  <div>B</div>
                </div>`,
              },
            ]);

            router.go("/initial-scroll");
            await sleep(50);

            window.scrollTo(0, 500);
            await router.doRouting("/initial-scroll", undefined, true);
            expect(window.scrollY).to.equal(500);
          });

          it("resets new routes during HMR", async () => {
            window.isHMR = true;
            router = new Router([
              {
                path: "/hmr-scroll-a",
                element: `<div style="height: 2000px;">A</div>`,
              },
              {
                path: "/hmr-scroll-b",
                element: `<div style="height: 2000px;">B</div>`,
              },
            ]);

            router.go("/hmr-scroll-a");
            await sleep(50);

            window.scrollTo(0, 500);
            router.go("/hmr-scroll-b");
            await sleep(50);
            expect(window.scrollY).to.equal(0);
            delete window.isHMR;
          });

          it("sets scroll to 0 when navigating to another route", async () => {
            document.body.insertAdjacentHTML(
              "beforeend",
              `<div style="height: 2000px;">
                <a href="/a">A</a>
                <a href="/b">B</a>
                <div data-outlet></div>
              </div>`,
            );

            router = new Router([
              {
                path: "/a",
                element: `<div>A Content</div>`,
              },
              {
                path: "/b",
                element: `<div>B Content</div>`,
              },
            ]);

            router.go("/a");
            await sleep(50);

            window.scrollTo(0, 600);
            router.go("/b");
            await sleep(50);

            expect(window.scrollY).to.equal(0);
          });

          it("does restore the scroll when scrolling, navigating and navigating back", async () => {
            document.body.insertAdjacentHTML(
              "beforeend",
              `<div style="height: 2000px;">
                <a href="/a">A</a>
                <a href="/b">B</a>
                <div data-outlet></div>
              </div>`,
            );

            router = new Router([
              {
                path: "/a",
                element: `<div>A Content</div>`,
              },
              {
                path: "/b",
                element: `<div>B Content</div>`,
              },
            ]);
            window.router = router;

            router.go("/a");
            await sleep(50);

            window.scrollTo(0, 500);
            router.go("/b");
            await sleep(50);
            expect(window.scrollY).to.equal(0);

            history.back();
            await sleep(50);

            expect(window.scrollY).to.equal(500);
          });
        });
      });
    </script>
  </head>
  <body>
    <a id="profile" href="/settings/profile">Profile</a>
    <div data-outlet></div>
  </body>
</html>
